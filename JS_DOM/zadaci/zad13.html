<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 13</title>
    <style>
        p{
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p>0</p>
    <br><br>
    <button>Klik</button>

    <script>
        const p = document.querySelector("p");
        const btn = document.querySelector("button");
        let i = 0;

        btn.onclick = function(){
            if(i === 10){
                return;
            }
            else{
                i++;
                if(i === 10){
                    p.style.color = "green";
                }
                p.textContent = i;
            }
        }
    </script>
</body>
</html>
