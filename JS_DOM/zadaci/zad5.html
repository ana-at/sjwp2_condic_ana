<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 5</title>
</head>
<body>
    <button id="gumb">Prikaži poruku</button>
    <p id="tekst">
        Ovo je tekst.
    </p>

    <script>
        const gumb = document.getElementById("gumb");
        const tekst = document.getElementById("tekst");

        gumb.onclick = function(){
            tekst.textContent = "Uspješno ste kliknuli gumb!";
        }
    </script>
</body>
</html>
