<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 8</title>
    <style>
        .istaknuto{
            color: blue;
        }
        .kartica{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="kartica">
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Fugit ipsum eaque vero quam doloremque laboriosam qui, pariatur repellendus. 
            Deserunt fugiat accusamus obcaecati in, officiis consectetur. Expedita sed nisi vel quia.</p>
    </div>
    <button>btn</button>

    <script>
        const kartica = document.querySelector(".kartica");
        const btn = document.querySelector("button");
        
        btn.onclick = function(){
            kartica.classList.toggle("istaknuto");
        }
    </script>
</body>
</html>
