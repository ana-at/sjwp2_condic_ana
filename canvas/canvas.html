<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <canvas id="mycanvas" width="600" height="600" style="border: 1px solid black;"></canvas>

    <script>
        let c = document.getElementById("mycanvas");
        let ctx = c.getContext("2d");

        //pravokutnik
        ctx.beginPath();
        ctx.rect(10, 10, 400, 400);
        ctx.fillStyle = "yellow";
        ctx.fill();

        //krug
        ctx.beginPath();
        ctx.arc(200, 300, 100, 0, 2*Math.PI);
        ctx.strokeStyle = "blue";
        ctx.stroke();

        //linije
        ctx.moveTo(100, 200);
        ctx.lineTo(200, 300);
        ctx.lineTo(50, 300);
        ctx.lineTo(100, 200);
        ctx.stroke();
    </script>
</body>
</html>
