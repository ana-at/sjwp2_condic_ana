<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 4</title>
</head>
<body>
    <canvas id="mycanvas" width="600" height="600" style="border: 1px solid black;"></canvas>

    <script>
        let c = document.getElementById("mycanvas");
        let ctx = c.getContext("2d");

        ctx.beginPath();
        ctx.rect(250, 400, 75, 100);
        ctx.fillStyle = "brown";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(132, 425);
        ctx.lineTo(432, 425);
        ctx.lineTo(282, 200);
        ctx.lineTo(132, 425);
        ctx.fillStyle = "darkgreen";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(162, 325);
        ctx.lineTo(402, 325);
        ctx.lineTo(282, 150);
        ctx.lineTo(162, 325);
        ctx.fillStyle = "green";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(182, 225);
        ctx.lineTo(382, 225);
        ctx.lineTo(282, 50);
        ctx.lineTo(182, 225);
        ctx.fillStyle = "grassgreen";
        ctx.fill();
    </script>
</body>
</html>
