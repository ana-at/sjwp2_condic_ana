<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Repository</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #24292f;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .page-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .page-list li {
            margin-bottom: 12px;
        }

        .page-list a {
            display: block;
            padding: 15px 18px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .page-list a:hover {
            background: #0969da;
            color: white;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>Ana Čondić</h1>

        <p class="description">
            Zadaće
        </p>

        <ul class="page-list">
            <!-- Add your pages here -->

            <li>
                <a href="page1.html">Page 1</a>
            </li>

            <li>
                <a href="page2.html">Page 2</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>
        </ul>

        <footer>
            Hosted with GitHub Pages
        </footer>
    </main>

</body>
</html>
